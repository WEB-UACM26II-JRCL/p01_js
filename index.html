<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adivina el numero</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <main class="tarjeta">
        <p class="etiqueta">Practica 01 · JavaScript</p>
        <h1>Adivina el numero</h1>
        <p class="descripcion">He pensado un numero entre 1 y 100.
            Intenta descubrirlo con las pistas.</p>

        <label for="numero">Tu intento</label>
        <input type="number" id="numero" min="1" max="100"
               placeholder="Escribe un numero">

        <button type="button" onclick="comprobar()">Comprobar</button>

        <p id="mensaje" class="mensaje" aria-live="polite">
            Ingresa un numero para comenzar.
        </p>
        <p class="contador">Intentos: <strong id="intentos">0</strong></p>
        

        <button type="button" class="secundario" onclick="nuevoJuego()">
            Nuevo juego
        </button>
        
        
    </main>
</body>
</html>
